<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割作成支援アプリ</title>
    <style>
        :root {
            --sidebar-width: 300px;
            --header-height: 40px;
            --cell-width: 100px;
            --cell-height: 60px;
            --border-color: #ccc;
            --bg-color: #f9f9f9;
            --primary-color: #4a90e2;
            --error-bg: #ffcccc;
            --ng-bg: #e0e0e0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        /* Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        #sidebar h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .control-panel {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 4px;
            background-color: var(--primary-color);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        button.secondary {
            background-color: #6c757d;
        }
        
        button.secondary:hover {
            background-color: #5a6268;
        }

        #teacher-list {
            flex: 1;
            overflow-y: auto;
        }

        .teacher-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .teacher-item input {
            border: 1px solid #ddd;
            padding: 4px;
            border-radius: 3px;
            width: 45%;
        }

        .teacher-ng-btn {
            font-size: 10px;
            padding: 2px 5px;
            background: #eee;
            color: #333;
            width: auto;
            margin: 0;
        }
        
        .teacher-ng-btn.active {
            background: #ff9800;
            color: white;
        }

        /* Main Content */
        #main-content {
            flex: 1;
            overflow: auto;
            position: relative;
            background: white;
        }

        /* Timetable Grid */
        #timetable {
            border-collapse: collapse;
            table-layout: fixed;
        }

        #timetable th, #timetable td {
            border: 1px solid var(--border-color);
            width: var(--cell-width);
            height: var(--cell-height);
            text-align: center;
            font-size: 12px;
            padding: 2px;
            position: relative;
        }

        #timetable th {
            background-color: #f0f0f0;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        
        #timetable th.row-header {
            position: sticky;
            left: 0;
            z-index: 6;
            background-color: #f0f0f0;
        }
        
        #timetable th.corner {
            z-index: 7;
            left: 0;
            top: 0;
        }

        .cell-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .cell-content select {
            width: 95%;
            font-size: 11px;
            margin-bottom: 2px;
            border: none;
            background: transparent;
            text-align: center;
        }

        .cell-error {
            background-color: var(--error-bg) !important;
        }
        
        .cell-ng {
             background-color: var(--ng-bg);
             color: #999;
             pointer-events: none;
        }

        /* Modal for NG setting */
        #ng-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        #ng-modal-content {
            background: white;
            padding: 20px;
            border-radius: 5px;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .ng-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* Header + 6 periods */
            gap: 5px;
            margin-top: 10px;
        }
        
        .ng-cell {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
            cursor: pointer;
        }
        
        .ng-cell.header {
            background: #eee;
            font-weight: bold;
            cursor: default;
        }
        
        .ng-cell.selected {
            background: #ff9800;
            color: white;
        }

    </style>
</head>
<body>

<div id="sidebar">
    <h2>操作パネル</h2>
    <div class="control-panel">
        <button onclick="autoAssign()" title="空いている枠にランダムに割り当てます">簡易自動割り当て</button>
        <button class="secondary" onclick="resetSchedule()">リセット</button>
        <button class="secondary" onclick="exportCSV()">CSV保存(簡易)</button>
    </div>
    
    <h2>教員一覧</h2>
    <div id="teacher-list">
        <!-- Teacher items inserted here -->
    </div>
</div>

<div id="main-content">
    <table id="timetable">
        <thead>
            <!-- Headers generated by JS -->
        </thead>
        <tbody>
            <!-- Rows generated by JS -->
        </tbody>
    </table>
</div>

<!-- NG Setting Modal -->
<div id="ng-modal">
    <div id="ng-modal-content">
        <h3 id="ng-modal-title">NGタイム設定</h3>
        <p>クリックしてNG（出張・不可）の時間帯を設定してください。</p>
        <div id="ng-grid" class="ng-grid">
            <!-- Grid generated by JS -->
        </div>
        <div style="margin-top: 20px; text-align: right;">
            <button onclick="closeNgModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
/**
 * Data Structures
 */
const GRADES = 3;
const CLASSES_PER_GRADE = 4;
const PERIODS = 6;
const DAYS = ['月', '火', '水', '木', '金'];
const SUBJECTS = ['国語', '数学', '英語', '理科', '社会', '体育', '美術', '音楽', '技術', '家庭', 'その他'];

// Generate Classes
const classList = [];
for (let g = 1; g <= GRADES; g++) {
    for (let c = 1; c <= CLASSES_PER_GRADE; c++) {
        classList.push(`${g}-${c}`);
    }
}
classList.push("特支"); // Special Needs Class

// Initial Teachers Data
let teachers = Array.from({length: 30}, (_, i) => ({
    id: `t${i+1}`,
    name: `教員${i+1}`,
    subject: SUBJECTS[i % SUBJECTS.length],
    ng: {} // key: "DayIndex-PeriodIndex" (e.g. "0-1" for Mon 1st period)
}));

// Schedule Data: Map "ClassID-DayIndex-PeriodIndex" -> { teacherId: string }
let schedule = {};


/**
 * Initialization
 */
window.onload = function() {
    renderTeacherList();
    renderTimetable();
};

/**
 * Rendering Logic
 */
function renderTeacherList() {
    const listEl = document.getElementById('teacher-list');
    listEl.innerHTML = '';
    
    teachers.forEach(t => {
        const div = document.createElement('div');
        div.className = 'teacher-item';
        div.innerHTML = `
            <div>
                <input type="text" value="${t.name}" onchange="updateTeacherName('${t.id}', this.value)" placeholder="名前">
                <input type="text" value="${t.subject}" onchange="updateTeacherSubject('${t.id}', this.value)" placeholder="教科" style="width: 30%;">
            </div>
            <button class="teacher-ng-btn" onclick="openNgModal('${t.id}')">NG設定</button>
        `;
        listEl.appendChild(div);
    });
}

function renderTimetable() {
    const table = document.getElementById('timetable');
    table.innerHTML = '';
    
    // Header Row 1: Days (spanning all periods)
    const thead = document.createElement('thead');
    const headerRow1 = document.createElement('tr');
    
    // Corner cell
    const corner = document.createElement('th');
    corner.className = 'corner';
    corner.rowSpan = 2;
    corner.textContent = 'クラス';
    corner.style.width = '80px';
    headerRow1.appendChild(corner);

    DAYS.forEach(d => {
        const th = document.createElement('th');
        th.colSpan = PERIODS;
        th.textContent = d;
        headerRow1.appendChild(th);
    });
    thead.appendChild(headerRow1);

    // Header Row 2: Periods
    const headerRow2 = document.createElement('tr');
    DAYS.forEach(() => {
        for(let p=1; p<=PERIODS; p++) {
            const th = document.createElement('th');
            th.textContent = p;
            headerRow2.appendChild(th);
        }
    });
    thead.appendChild(headerRow2);
    table.appendChild(thead);

    // Body: Classes
    const tbody = document.createElement('tbody');
    classList.forEach(cls => {
        const tr = document.createElement('tr');
        
        // Class Name Header
        const resultTh = document.createElement('th');
        resultTh.className = 'row-header';
        resultTh.textContent = cls;
        tr.appendChild(resultTh);

        // Cells
        for(let d=0; d<DAYS.length; d++) {
            for(let p=1; p<=PERIODS; p++) {
                const td = document.createElement('td');
                const cellKey = `${cls}-${d}-${p}`;
                td.id = `cell-${cellKey}`;
                
                // Content
                const assignment = schedule[cellKey];
                const teacherId = assignment ? assignment.teacherId : "";
                
                const select = document.createElement('select');
                select.innerHTML = '<option value="">-</option>';
                // Populate options (can be optimized for hundreds of cells this might be slow, but for this scale it's fine)
                teachers.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = t.name; // (${t.subject})
                    if(t.id === teacherId) opt.selected = true;
                    select.appendChild(opt);
                });
                
                select.onchange = (e) => assignTeacher(cellKey, e.target.value);
                
                td.appendChild(select);
                tr.appendChild(td);
            }
        }
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    
    // Check conflicts after rendering
    checkConflictsAll();
}

/**
 * Core Logic
 */

function updateTeacherName(id, val) {
    const t = teachers.find(x => x.id === id);
    if(t) {
        t.name = val;
        // Re-render only selects to update names? Or full re-render?
        // For simplicity full re-render of grid is safer but slower. 
        // Let's just update the options in place if possible, but rendering is cheap enough here.
        // Actually, let's just refresh the grid to reflect name changes.
        // We need to preserve scroll position potentially, but let's stick to simple reload for now.
        // To avoid focus loss on input, we DON'T re-render teacher list.
        renderTimetable(); 
    }
}

function updateTeacherSubject(id, val) {
    const t = teachers.find(x => x.id === id);
    if(t) t.subject = val;
}

function assignTeacher(cellKey, teacherId) {
    if(!teacherId) {
        delete schedule[cellKey];
    } else {
        schedule[cellKey] = { teacherId };
    }
    checkConflictsAll();
}

function checkConflictsAll() {
    // Clear all errors first
    document.querySelectorAll('#timetable td').forEach(td => td.classList.remove('cell-error'));

    // 1. Double Booking Check
    // Map: "TeacherID-Day-Period" -> [List of Classes]
    const teacherScheduleMap = {};

    for (const [cellKey, assignment] of Object.entries(schedule)) {
        if (!assignment || !assignment.teacherId) continue;

        const [cls, d, p] = cellKey.split('-'); // e.g. "1-1", "0", "1"
        const timeKey = `${d}-${p}`;
        const mapKey = `${assignment.teacherId}-${timeKey}`;

        if (!teacherScheduleMap[mapKey]) {
            teacherScheduleMap[mapKey] = [];
        }
        teacherScheduleMap[mapKey].push(cellKey);
    }

    // Identify duplicates
    for (const [mapKey, cellKeys] of Object.entries(teacherScheduleMap)) {
        if (cellKeys.length > 1) {
            // Conflict found!
            cellKeys.forEach(k => {
                const el = document.getElementById(`cell-${k}`);
                if(el) el.classList.add('cell-error');
            });
        }
        
        // 2. NG Time Check
        const [tid, dIndex, pIndex] = mapKey.split('-');
        const teacher = teachers.find(t => t.id === tid);
        const ngKey = `${dIndex}-${pIndex}`; // matches ng storage format
        if(teacher && teacher.ng[ngKey]) {
             cellKeys.forEach(k => {
                const el = document.getElementById(`cell-${k}`);
                if(el) el.classList.add('cell-error');
            });
        }
    }
}

function autoAssign() {
    if(!confirm("現在の空きコマに自動で教員を割り当てますか？（既存の配置は維持されます）")) return;

    // Simple Randomized Greedy
    classList.forEach(cls => {
        for(let d=0; d<DAYS.length; d++) {
            for(let p=1; p<=PERIODS; p++) {
                const cellKey = `${cls}-${d}-${p}`;
                if(schedule[cellKey]) continue; // Skip filled

                // Attempt to find a valid teacher
                // Shuffle teachers to randomize
                const shuffled = [...teachers].sort(() => 0.5 - Math.random());
                
                for(const t of shuffled) {
                    // Check NG
                    if(t.ng[`${d}-${p}`]) continue;

                    // Check Double Booking
                    // Is this teacher already working at d-p?
                    let busy = false;
                    for(const [existingKey, assign] of Object.entries(schedule)) {
                        if(assign.teacherId === t.id) {
                            const [_, ed, ep] = existingKey.split('-');
                            if(ed == d && ep == p) {
                                busy = true;
                                break;
                            }
                        }
                    }
                    if(busy) continue;

                    // Assign
                    schedule[cellKey] = { teacherId: t.id };
                    break; // Move to next cell
                }
            }
        }
    });
    
    renderTimetable();
}

function resetSchedule() {
    if(confirm("全ての配置をクリアしますか？")) {
        schedule = {};
        renderTimetable();
    }
}

function exportCSV() {
    let csv = "曜日,時限," + classList.join(",") + "\n";
    
    for(let d=0; d<DAYS.length; d++) {
        for(let p=1; p<=PERIODS; p++) {
            let row = `${DAYS[d]},${p}限`;
            classList.forEach(cls => {
                const cellKey = `${cls}-${d}-${p}`;
                const assign = schedule[cellKey];
                let val = "";
                if(assign) {
                    const t = teachers.find(x => x.id === assign.teacherId);
                    if(t) val = t.name;
                }
                row += `,${val}`;
            });
            csv += row + "\n";
        }
    }
    
    // Download Blob
    const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv' }); // BOM for Excel
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'timetable.csv';
    a.click();
}


/**
 * NG Modal Logic
 */
let currentNgTeacherId = null;

function openNgModal(teacherId) {
    currentNgTeacherId = teacherId;
    const t = teachers.find(x => x.id === teacherId);
    if(!t) return;
    
    document.getElementById('ng-modal-title').textContent = `${t.name} のNG設定`;
    document.getElementById('ng-modal').style.display = 'flex';
    renderNgGrid(t);
}

function closeNgModal() {
    document.getElementById('ng-modal').style.display = 'none';
    currentNgTeacherId = null;
    checkConflictsAll(); // Re-check in case NG changed affecting current schedule
}

function renderNgGrid(teacher) {
    const container = document.getElementById('ng-grid');
    container.innerHTML = '';
    
    // Header Row
    const empty = document.createElement('div');
    empty.className = 'ng-cell header';
    container.appendChild(empty);
    
    for(let p=1; p<=PERIODS; p++) {
        const h = document.createElement('div');
        h.className = 'ng-cell header';
        h.textContent = `${p}限`;
        container.appendChild(h);
    }
    
    // Rows
    DAYS.forEach((dayName, dIndex) => {
        const dayHeader = document.createElement('div');
        dayHeader.className = 'ng-cell header';
        dayHeader.textContent = dayName;
        container.appendChild(dayHeader);
        
        for(let p=1; p<=PERIODS; p++) {
            const cell = document.createElement('div');
            const key = `${dIndex}-${p}`;
            cell.className = 'ng-cell';
            if(teacher.ng[key]) {
                cell.classList.add('selected');
                cell.textContent = "NG";
            } else {
                cell.textContent = "-";
            }
            
            cell.onclick = () => toggleNg(teacher, key, cell);
            container.appendChild(cell);
        }
    });
}

function toggleNg(teacher, key, cellEl) {
    if(teacher.ng[key]) {
        delete teacher.ng[key];
        cellEl.classList.remove('selected');
        cellEl.textContent = "-";
    } else {
        teacher.ng[key] = true;
        cellEl.classList.add('selected');
        cellEl.textContent = "NG";
    }
}

</script>
</body>
</html>
