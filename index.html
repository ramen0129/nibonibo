<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高機能 時間割作成支援システム</title>
    <style>
        :root {
            --sidebar-width: 320px;
            --stats-height: 150px;
            --header-height: 50px;
            --cell-width: 140px;
            --cell-height: 90px;
            --border-color: #ccc;
            --bg-color: #f5f7fa;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --error-bg: #ffcfcf;
            --warn-bg: #fff3cd;
            --success-bg: #d4edda;
            --ng-bg: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: #333;
        }

        /* Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
        }

        #logo-area {
            padding: 15px;
            background: var(--primary-color);
            color: white;
        }

        #logo-area h1 {
            margin: 0;
            font-size: 18px;
        }

        #logo-area p {
            margin: 5px 0 0;
            font-size: 11px;
            opacity: 0.8;
        }

        .nav-tabs {
            display: flex;
            background: #eee;
        }

        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            border-bottom: 2px solid transparent;
        }

        .nav-tab.active {
            background: white;
            border-bottom: 2px solid var(--accent-color);
            font-weight: bold;
            color: var(--accent-color);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .panel-section {
            margin-bottom: 20px;
        }

        .panel-section h3 {
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
            color: #666;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .dash-item {
            font-size: 12px;
            padding: 5px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }

        .dash-item.alert {
            color: #d32f2f;
            font-weight: bold;
        }

        .dash-item.warn {
            color: #f57c00;
        }

        button {
            width: 100%;
            padding: 8px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        button.danger {
            background: #e74c3c;
        }

        /* Main Area */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Views */
        .view-container {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: none;
            /* Toggled by JS */
        }

        .view-container.active {
            display: block;
        }

        /* Timetable View specifically needs to remove padding for full scroll */
        #view-timetable {
            padding: 0;
            overflow: auto;
        }

        /* 3. Grid Styles */
        table.data-table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            font-size: 12px;
        }

        table.data-table th,
        table.data-table td {
            border: 1px solid var(--border-color);
            padding: 5px;
            text-align: center;
        }

        table.data-table th {
            background: #f8f9fa;
            font-weight: bold;
        }

        /* The Big Schedule Grid */
        #schedule-grid {
            border-collapse: separate;
            /* For sticky headers */
            border-spacing: 0;
            table-layout: fixed;
        }

        #schedule-grid th,
        #schedule-grid td {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            width: var(--cell-width);
            height: var(--cell-height);
            padding: 2px;
            vertical-align: top;
            box-sizing: border-box;
            background: white;
        }

        /* Sticky Headers */
        #schedule-grid thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            background: #f1f3f5;
            border-top: 1px solid var(--border-color);
        }

        #schedule-grid .row-header {
            position: sticky;
            left: 0;
            z-index: 6;
            background: #f1f3f5;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: var(--cell-height);
            border-left: 1px solid var(--border-color);
        }

        #schedule-grid .corner-header {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 7;
            background: #e9ecef;
            border-left: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
        }

        /* Cell Content */
        .cell-inner {
            display: flex;
            flex-direction: column;
            gap: 2px;
            height: 100%;
        }

        .cell-inner select {
            font-size: 11px;
            border: 1px solid #eee;
            background: transparent;
            cursor: pointer;
        }

        .cell-inner select:hover {
            border-color: #ccc;
        }

        /* Cell States */
        .cell-error {
            background-color: var(--error-bg) !important;
            box-shadow: inset 0 0 0 2px #ff6b6b;
        }

        .cell-ng {
            background-color: var(--ng-bg) !important;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Stats Table in Curriculum View */
        .stat-ok {
            color: green;
            font-weight: bold;
        }

        .stat-bad {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div id="logo-area">
            <h1>TimeTable Pro</h1>
            <p>単一ファイル型 高機能時間割システム</p>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchView('timetable')">時間割</div>
            <div class="nav-tab" onclick="switchView('curriculum')">単位設定</div>
            <div class="nav-tab" onclick="switchView('teachers')">教員設定</div>
            <div class="nav-tab" onclick="switchView('settings')">基本設定</div>
        </div>

        <div class="sidebar-content" id="panel-content">
            <!-- Dynamic Content based on View -->
            <div id="sidebar-dashboard">
                <h3>システム状態</h3>
                <div id="dashboard-stats">
                    <!-- Inserted by JS -->
                </div>

                <div style="margin-top:20px;">
                    <h3>ショートカット</h3>
                    <button onclick="autoAssignNaive()">簡易自動充填</button>
                    <button onclick="clearSchedule()" class="danger" style="margin-top:10px;">全クリア</button>
                    <button onclick="exportCSV()" style="margin-top:10px; background:#27ae60;">CSV保存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="main-area">
        <!-- View: Timetable -->
        <div id="view-timetable" class="view-container active">
            <table id="schedule-grid">
                <!-- JS Generated -->
            </table>
        </div>

        <!-- View: Curriculum -->
        <div id="view-curriculum" class="view-container">
            <h2>カリキュラム設定（週当たり必要コマ数）</h2>
            <p>各学年の教科ごとの必要単位数を入力してください。</p>
            <div id="curriculum-editor"></div>
        </div>

        <!-- View: Teachers -->
        <div id="view-teachers" class="view-container">
            <h2>教員管理</h2>
            <p>名前、持ちコマ上限、担当教科を設定します。</p>
            <div id="teachers-editor"></div>
        </div>

        <!-- View: Settings -->
        <div id="view-settings" class="view-container">
            <h2>基本設定</h2>
            <div class="panel-section">
                <h3>曜日と時限</h3>
                <div id="days-config"></div>
            </div>
        </div>
    </div>

    <!-- Modal for NG -->
    <div id="modal-ng"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:center;">
        <div
            style="background:white; padding:20px; border-radius:5px; max-width:600px; max-height:80vh; overflow:auto;">
            <h3>NGタイム設定</h3>
            <div id="ng-grid-editor"></div>
            <button onclick="closeNgModal()" style="margin-top:10px;">閉じる</button>
        </div>
    </div>

    <script>
        /**
         * --- Application State ---
         */
        const App = {
            config: {
                grades: 3,
                classesPerGrade: 4,
                hasSpecialClass: true,
                days: [
                    { id: 'mon', name: '月', periods: 6 },
                    { id: 'tue', name: '火', periods: 6 },
                    { id: 'wed', name: '水', periods: 5 },
                    { id: 'thu', name: '木', periods: 6 },
                    { id: 'fri', name: '金', periods: 6 }
                ]
            },
            subjects: ['国語', '社会', '数学', '理科', '英語', '音楽', '美術', '体育', '技術', '家庭', '道徳', '学活', '総合'],

            // Grade -> Subject -> Count
            curriculum: {},

            teachers: [], // { id, name, maxHours, subjects: [], ng: {} }

            // ClassID-DayIndex-PeriodIndex -> { subject: str, teacherId: str }
            schedule: {},

            // Runtime validation results
            errors: [],
            stats: {
                teacherLoad: {}, // teacherId -> count
                classProgress: {} // classId -> subject -> count
            }
        };

        /**
         * --- Initialization ---
         */
        function init() {
            // 1. Initialize Curriculum Defaults
            for (let g = 1; g <= App.config.grades; g++) {
                App.curriculum[g] = {};
                App.subjects.forEach(s => App.curriculum[g][s] = 4); // Default 4
            }
            App.curriculum['Special'] = {};
            App.subjects.forEach(s => App.curriculum['Special'][s] = 2);

            // 2. Initialize Dummy Teachers
            for (let i = 1; i <= 30; i++) {
                App.teachers.push({
                    id: `t${i}`,
                    name: `教員${i}`,
                    maxHours: 18,
                    subjects: [App.subjects[i % 5]], // Assign random primary subject
                    ng: {}
                });
            }

            renderAll();
        }

        function renderAll() {
            renderDaysConfig();
            renderCurriculumEditor();
            renderTeachersEditor();
            renderTimetable(); // This triggers validation and dashboard update
        }

        /**
         * --- Views & Navigation ---
         */
        function switchView(viewId) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');

            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            // Find the tab that calls this function (naive but works for onclick)
            // Actually let's just use text matching or update all manually
            const tabs = document.querySelectorAll('.nav-tab');
            if (viewId === 'timetable') tabs[0].classList.add('active');
            if (viewId === 'curriculum') tabs[1].classList.add('active');
            if (viewId === 'teachers') tabs[2].classList.add('active');
            if (viewId === 'settings') tabs[3].classList.add('active');

            // Re-render if needed
            if (viewId === 'timetable') renderTimetable();
        }

        /**
         * --- Settings Logic ---
         */
        function renderDaysConfig() {
            const div = document.getElementById('days-config');
            div.innerHTML = '';

            App.config.days.forEach((d, idx) => {
                const row = document.createElement('div');
                row.className = 'form-group';
                row.style.display = 'flex';
                row.style.alignItems = 'center';
                row.style.gap = '10px';

                row.innerHTML = `
            <label style="width:50px;">${d.name}曜日</label>
            <input type="number" min="0" max="10" value="${d.periods}" 
                   onchange="updateDayPeriod(${idx}, this.value)" style="width:60px;">
            <span>時限</span>
        `;
                div.appendChild(row);
            });
        }

        function updateDayPeriod(dayIdx, val) {
            App.config.days[dayIdx].periods = parseInt(val);
            renderTimetable(); // Re-render grid structure
        }

        /**
         * --- Curriculum Logic ---
         */
        function renderCurriculumEditor() {
            const container = document.getElementById('curriculum-editor');
            let html = '<table class="data-table"><thead><tr><th>学年</th>';
            App.subjects.forEach(s => html += `<th>${s}</th>`);
            html += '</tr></thead><tbody>';

            for (let g = 1; g <= App.config.grades; g++) {
                html += `<tr><td>${g}年</td>`;
                App.subjects.forEach(s => {
                    const val = App.curriculum[g][s] || 0;
                    html += `<td><input type="number" value="${val}" min="0" max="10" style="width:40px;" 
                     onchange="updateCurriculum(${g}, '${s}', this.value)"></td>`;
                });
                html += '</tr>';
            }
            // Special class
            html += `<tr><td>特支</td>`;
            App.subjects.forEach(s => {
                const val = App.curriculum['Special'][s] || 0;
                html += `<td><input type="number" value="${val}" min="0" max="10" style="width:40px;"
                 onchange="updateCurriculum('Special', '${s}', this.value)"></td>`;
            });
            html += '</tr></tbody></table>';
            container.innerHTML = html;
        }

        function updateCurriculum(grade, subject, val) {
            App.curriculum[grade][subject] = parseInt(val);
            validateAll(); // Update stats
        }

        /**
         * --- Teachers Logic ---
         */
        function renderTeachersEditor() {
            const container = document.getElementById('teachers-editor');
            let html = '<table class="data-table"><thead><tr><th>ID</th><th>名前</th><th>週上限</th><th>担当教科(メモ)</th><th>NG設定</th></tr></thead><tbody>';

            App.teachers.forEach(t => {
                html += `<tr>
            <td>${t.id}</td>
            <td><input type="text" value="${t.name}" onchange="updateTeacher('${t.id}', 'name', this.value)"></td>
            <td><input type="number" value="${t.maxHours}" onchange="updateTeacher('${t.id}', 'maxHours', this.value)" style="width:50px;"></td>
            <td><input type="text" value="${t.subjects.join(',')}" onchange="updateTeacher('${t.id}', 'subjects', this.value)"></td>
            <td><button onclick="openNgModal('${t.id}')">NG設定</button></td>
        </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function updateTeacher(id, field, val) {
            const t = App.teachers.find(x => x.id === id);
            if (!t) return;
            if (field === 'maxHours') t.maxHours = parseInt(val);
            else if (field === 'subjects') t.subjects = val.split(',').map(s => s.trim());
            else t[field] = val;
            validateAll();
        }

        /**
         * --- Main Timetable Logic ---
         */
        function renderTimetable() {
            validateAll(); // Ensure stats are fresh

            const table = document.getElementById('schedule-grid');
            table.innerHTML = '';

            // Headers
            const thead = document.createElement('thead');

            // Row 1: Days
            const tr1 = document.createElement('tr');
            tr1.innerHTML = '<th class="corner-header" rowspan="2">クラス</th>';
            App.config.days.forEach(d => {
                const th = document.createElement('th');
                th.colSpan = d.periods;
                th.textContent = d.name;
                tr1.appendChild(th);
            });
            thead.appendChild(tr1);

            // Row 2: Periods
            const tr2 = document.createElement('tr');
            App.config.days.forEach(d => {
                for (let p = 1; p <= d.periods; p++) {
                    const th = document.createElement('th');
                    th.textContent = p;
                    tr2.appendChild(th);
                }
            });
            thead.appendChild(tr2);
            table.appendChild(thead);

            // Body
            const tbody = document.createElement('tbody');
            const classes = getClassList();

            classes.forEach(cls => {
                const tr = document.createElement('tr');
                // Sticky Row Header
                const rh = document.createElement('td'); // Changed to td but styled as header to fix sticky issues sometimes
                rh.className = 'row-header';
                rh.textContent = cls;
                tr.appendChild(rh);

                // Cells
                App.config.days.forEach((d, dIdx) => {
                    for (let p = 1; p <= d.periods; p++) {
                        const td = document.createElement('td');
                        const key = `${cls}_${dIdx}_${p}`;

                        // Get Assignment
                        const assign = App.schedule[key] || { subject: '', teacherId: '' };

                        // Check Errors for this cell
                        const cellErrors = App.errors.filter(e => e.key === key);
                        if (cellErrors.length > 0) {
                            td.classList.add('cell-error');
                            td.title = cellErrors.map(e => e.msg).join('\n');
                        }

                        // Render Inner
                        const div = document.createElement('div');
                        div.className = 'cell-inner';

                        // Subject Select
                        const selSub = document.createElement('select');
                        selSub.innerHTML = '<option value="">(教科)</option>';
                        App.subjects.forEach(s => {
                            const opt = document.createElement('option');
                            opt.value = s;
                            opt.textContent = s;
                            if (s === assign.subject) opt.selected = true;
                            selSub.appendChild(opt);
                        });
                        selSub.onchange = (e) => updateSchedule(key, 'subject', e.target.value);

                        // Teacher Select
                        const selTeach = document.createElement('select');
                        selTeach.innerHTML = '<option value="">(教員)</option>';
                        App.teachers.forEach(t => {
                            const opt = document.createElement('option');
                            opt.value = t.id;
                            opt.textContent = t.name;
                            if (t.id === assign.teacherId) opt.selected = true;
                            selTeach.appendChild(opt);
                        });
                        selTeach.onchange = (e) => updateSchedule(key, 'teacherId', e.target.value);

                        // NG Visual Check (if teacher selected)
                        if (assign.teacherId) {
                            const t = App.teachers.find(x => x.id === assign.teacherId);
                            if (t && t.ng[`${dIdx}-${p}`]) {
                                td.classList.add('cell-error'); // NG conflict
                            }
                        }

                        div.appendChild(selSub);
                        div.appendChild(selTeach);
                        td.appendChild(div);
                        tr.appendChild(td);
                    }
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
        }

        function getClassList() {
            const list = [];
            for (let g = 1; g <= App.config.grades; g++) {
                for (let c = 1; c <= App.config.classesPerGrade; c++) list.push(`${g}-${c}`);
            }
            if (App.config.hasSpecialClass) list.push("特支");
            return list;
        }

        function updateSchedule(key, field, val) {
            if (!App.schedule[key]) App.schedule[key] = { subject: '', teacherId: '' };
            App.schedule[key][field] = val;

            // Auto-remove if empty
            if (!App.schedule[key].subject && !App.schedule[key].teacherId) {
                delete App.schedule[key];
            }

            // If subject changed, maybe try to auto-set teacher based on logic? 
            // (Skipped for simplicity, user manually selects)

            renderTimetable(); // Full re-render to update validation colors
        }

        /**
         * --- Validation & Stats ---
         */
        function validateAll() {
            App.errors = [];
            App.stats.teacherLoad = {};
            App.stats.classProgress = {};

            // Init Stats
            App.teachers.forEach(t => App.stats.teacherLoad[t.id] = 0);
            const classList = getClassList();
            classList.forEach(c => App.stats.classProgress[c] = {});

            // Loop Schedule
            const teacherUsage = {}; // "tID-day-per" -> [class]

            for (const [key, assign] of Object.entries(App.schedule)) {
                if (!assign.subject && !assign.teacherId) continue;

                const [cls, d, p] = key.split('_');

                // 1. Double Booking
                if (assign.teacherId) {
                    const timeKey = `${assign.teacherId}-${d}-${p}`;
                    if (!teacherUsage[timeKey]) teacherUsage[timeKey] = [];
                    teacherUsage[timeKey].push(key);

                    // NG Check
                    const t = App.teachers.find(x => x.id === assign.teacherId);
                    if (t && t.ng[`${d}-${p}`]) {
                        App.errors.push({ key, msg: `NG: ${t.name}はこの時間は授業不可です` });
                    }

                    // Load Count
                    App.stats.teacherLoad[assign.teacherId]++;
                }

                // 2. Curriculum Count
                if (assign.subject) {
                    if (!App.stats.classProgress[cls][assign.subject]) App.stats.classProgress[cls][assign.subject] = 0;
                    App.stats.classProgress[cls][assign.subject]++;
                }
            }

            // Process Double Bookings
            for (const [tKey, keys] of Object.entries(teacherUsage)) {
                if (keys.length > 1) {
                    keys.forEach(k => App.errors.push({ key: k, msg: "重複: 同じ教員が複数のクラスに配置されています" }));
                }
            }

            updateDashboard();
        }

        function updateDashboard() {
            const div = document.getElementById('dashboard-stats');
            div.innerHTML = '';

            // 1. Errors Summary
            if (App.errors.length > 0) {
                const d = document.createElement('div');
                d.className = 'dash-item alert';
                d.textContent = `⚠️ エラーが ${App.errors.length} 件あります`;
                div.appendChild(d);
            }

            // 2. Teacher Overwork
            let overworkCount = 0;
            App.teachers.forEach(t => {
                const load = App.stats.teacherLoad[t.id] || 0;
                if (load > t.maxHours) {
                    const d = document.createElement('div');
                    d.className = 'dash-item alert';
                    d.textContent = `${t.name}: ${load}/${t.maxHours}時間 (超過)`;
                    div.appendChild(d);
                    overworkCount++;
                }
            });

            // 3. Curriculum Status (Simplified View)
            // Just show total "Unmet" subjects
            let unmetCount = 0;
            const classes = getClassList();
            classes.forEach(cls => {
                const grade = cls === '特支' ? 'Special' : cls.split('-')[0];
                App.subjects.forEach(sub => {
                    const required = App.curriculum[grade][sub] || 0;
                    const actual = (App.stats.classProgress[cls] && App.stats.classProgress[cls][sub]) || 0;
                    if (actual < required) unmetCount++;
                });
            });

            const d2 = document.createElement('div');
            d2.className = `dash-item ${unmetCount > 0 ? 'warn' : ''}`;
            d2.textContent = `不足カリキュラム: ${unmetCount}件`;
            div.appendChild(d2);
        }


        /**
         * --- Auto Assign (Naive) ---
         */
        function autoAssignNaive() {
            if (!confirm("空きコマを自動で埋めますか？（ランダム配置）")) return;

            const classes = getClassList();
            classes.forEach(cls => {
                const grade = cls === '特支' ? 'Special' : cls.split('-')[0];

                App.subjects.forEach(sub => {
                    let required = App.curriculum[grade][sub] || 0;
                    let current = (App.stats.classProgress[cls] && App.stats.classProgress[cls][sub]) || 0;
                    let needed = required - current;

                    if (needed <= 0) return;

                    // Try to find slots
                    for (let loop = 0; loop < 100; loop++) { // Safety break
                        if (needed <= 0) break;

                        // Pick random day/period
                        const dIdx = Math.floor(Math.random() * App.config.days.length);
                        const p = Math.floor(Math.random() * App.config.days[dIdx].periods) + 1;
                        const key = `${cls}_${dIdx}_${p}`;

                        if (App.schedule[key]) continue; // Occupied

                        // Find valid teacher
                        // 1. Teaches subject?
                        // 2. Not NG?
                        // 3. No double booking?
                        // 4. Not Overworked?

                        const candidates = App.teachers.filter(t => {
                            if (!t.subjects.includes(sub) && t.subjects[0] !== 'その他') return false; // Basic capability check
                            if (t.ng[`${dIdx}-${p}`]) return false;

                            // Check Double Booking
                            // Naive check against current schedule state in memory
                            // (Ideally we iterate app.schedule but that's slow inside loop. 
                            //  For small n strictly checking schedule map is okay)
                            const isBusy = Object.entries(App.schedule).some(([k, v]) => {
                                const [_, ed, ep] = k.split('_');
                                return v.teacherId === t.id && parseInt(ed) === dIdx && parseInt(ep) === p;
                            });

                            if (isBusy) return false;

                            const load = App.stats.teacherLoad[t.id] || 0;
                            if (load >= t.maxHours) return false;

                            return true;
                        });

                        if (candidates.length > 0) {
                            const t = candidates[Math.floor(Math.random() * candidates.length)];
                            App.schedule[key] = { subject: sub, teacherId: t.id };
                            App.stats.teacherLoad[t.id] = (App.stats.teacherLoad[t.id] || 0) + 1;
                            needed--;
                        }
                    }
                });
            });

            renderTimetable();
        }

        function clearSchedule() {
            if (confirm("全てのコマを消去しますか？")) {
                App.schedule = {};
                renderTimetable();
            }
        }

        function exportCSV() {
            let csv = "ClassName,Day,Period,Subject,Teacher\n";
            Object.entries(App.schedule).forEach(([key, val]) => {
                const [cls, d, p] = key.split('_');
                const dayName = App.config.days[d].name;
                const teacher = App.teachers.find(t => t.id === val.teacherId);
                const tName = teacher ? teacher.name : val.teacherId;
                csv += `${cls},${dayName},${p},${val.subject},${tName}\n`;
            });

            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'timetable_full.csv';
            a.click();
        }

        /**
         * --- NG Modal ---
         */
        let currentNgTID = null;
        function openNgModal(tid) {
            currentNgTID = tid;
            const t = App.teachers.find(x => x.id === tid);
            const container = document.getElementById('ng-grid-editor');
            document.getElementById('modal-ng').style.display = 'flex';

            let html = '<div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:5px;">';
            // Headers
            html += '<div></div>';
            for (let p = 1; p <= 6; p++) html += `<div style="background:#eee;text-align:center;">${p}限</div>`;

            App.config.days.forEach((d, dIdx) => {
                html += `<div style="background:#eee;text-align:center;">${d.name}</div>`;
                for (let p = 1; p <= 6; p++) {
                    if (p > d.periods) {
                        html += `<div style="background:#ccc;">-</div>`;
                    } else {
                        const key = `${dIdx}-${p}`;
                        const isNg = t.ng[key];
                        html += `<div onclick="toggleNg('${key}')" 
                              style="border:1px solid #ccc; text-align:center; cursor:pointer; background:${isNg ? '#ff9800' : 'white'}; color:${isNg ? 'white' : 'black'};">
                              ${isNg ? 'NG' : '-'}
                         </div>`;
                    }
                }
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function toggleNg(key) {
            const t = App.teachers.find(x => x.id === currentNgTID);
            if (t.ng[key]) delete t.ng[key];
            else t.ng[key] = true;
            openNgModal(currentNgTID); // re-render
            // Note: Main grid won't update until modal closed or manually called
        }

        function closeNgModal() {
            document.getElementById('modal-ng').style.display = 'none';
            currentNgTID = null;
            renderTimetable();
        }

        // Start
        init();

    </script>
</body>
